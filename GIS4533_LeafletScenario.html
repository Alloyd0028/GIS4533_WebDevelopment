<!-- 
    PLAN FOR LEAFLET SCENARIO:
    - Have title centered at top
    - Followed by a paragraph describing the map and how to use it
    - Then the expertly designed map:
        - Custom popups
            - Custom Locators
            - Custom popup content
        - Centered on Duluth
        - Good Basemap
        - Located below paragraph and title
        - Symbolized effectively and neatly
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Most Basic Web Map</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body{/* This makes everything centered from the top of the page */
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            text-align: center;
        }
        #map{
            width: 1000px;
            height: 750px;
            border: 1px solid black;
        }
        .title{
            font-family: Arial, Helvetica, sans-serif;
            font-size: 30px;
            display: flex;
            justify-content: top;
            align-items: top;
        }
        .text{
            font-family:'Times New Roman', Times, serif;
            font-size: 12px;
        }
        .popup-title{
            font-family: Arial, Helvetica, sans-serif;
            font-size: 18px;
        }
        .popup-styling{
            font-family: 'Times New Roman', Times, serif;
            font-size: 14px;
        }

    </style>
</head>
<body>
    <h1 class="title" style="margin: 0;">Duluth Points of Interest</h1>
    <h5>By Alexander Johnson</h5>


    <div class="text">
        <p> Hello! Welcome to the Zenith City, Duluth, MN!</p>


    </div>

    <div id="map"></div>
    
    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // Initialize the map, Centers map on Duluth so all points are visible
        const map = L.map('map').setView([46.76, -92.15], 11);

        // Add OpenStreetMap tiles
        var Stadia_AlidadeSatellite = L.tileLayer('https://tiles.stadiamaps.com/tiles/alidade_satellite/{z}/{x}/{y}{r}.{ext}?api_key=41db2904-39a2-49ee-a885-c295cf4c2cd6', {
	    minZoom: 0,
	    maxZoom: 20,
	    attribution: '&copy; CNES, Distribution Airbus DS, © Airbus DS, © PlanetObserver (Contains Copernicus Data) | &copy; <a href="https://www.stadiamaps.com/" target="_blank">Stadia Maps</a> &copy; <a href="https://openmaptiles.org/" target="_blank">OpenMapTiles</a> &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
	    ext: 'jpg'
        }).addTo(map);

        /*
        Essentially a copy/paste of Step 2 from Assigment 3
        */
        //fetch GeoJSON file
        fetch("duluth_points_of_interest.json")
            // once we fetch the geojson we need to convert then response into a json format
            .then(function (response) {
                return response.json()
            })
            // take the json data (our geojson's file data)
            // and create a leaflet layer based on that geojson (Adds it to the map)
            .then(function(geojsonData) {
                console.log('the geojson data', geojsonData);
                L.geoJSON(geojsonData, {
                    style: function(feature) {
                        return {
                            color: "black", // border color
                            weight: 5,      // border thickness
                            opacity: 1,     // border opacity
                        };
                    },  
                    // Takes the attributes from the json and shows them in the popup
                    // This is how every POI gets its popup content
                    onEachFeature: function(feature, layer) {
                        layer.bindPopup( 
                            "<div class = 'popup-styling'>" +
                            "<div class = 'popup-title'> Duluth Attraction: <b>" + feature.properties.Attraction + "</b></div><br>" +
                            "<b>Description: </b>" + feature.properties.Description + "<br>" +
                            // This links the pop-up website link text to the actual website
                            "<b>Website: </b><a href ='" + feature.properties.Website + "' target='_blank'>" + feature.properties.Website + "</a><br>" +
                            "<b>Address: </b>" + feature.properties.Address + "<br>" +
                            // This makes the image show up in the pop-up, as well as giving it a max width & height so it doesn't mess up the pop-up's size
                            "<b>Image: </b> <br><img src='" + feature.properties.Photo_URL + "' alt='Image' style='max-width:200px; max-height:200px;' />",
                            "</div>",
                        );
                    }
                }).addTo(map); 
            });
    </script>
</body>
</html>
