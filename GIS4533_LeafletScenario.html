<!-- 
    PLAN FOR LEAFLET SCENARIO:
    - Have title centered at top
    - Followed by a paragraph describing the map and how to use it
    - Then the expertly designed map:
        - Custom popups
            - Custom Locators
            - Custom popup content
        - Centered on Duluth
        - Good Basemap
        - Located below paragraph and title
        - Symbolized effectively and neatly
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Most Basic Web Map</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body{/* This makes everything centered from the top of the page */
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #map{
            width: 750px;
            height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid black;
        }

    </style>
</head>
<body>


    <div id="map"></div>
    
    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // Initialize the map, center it on UMD campus, and set the zoom level
        const map = L.map('map').setView([46.82, -92.08], 13);

        // Add OpenStreetMap tiles
        const tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

    </script>
</body>
</html>
