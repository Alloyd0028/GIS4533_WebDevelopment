<!-- 
    PLAN FOR LEAFLET SCENARIO:
    - Have title centered at top
    - Followed by a paragraph describing the map and how to use it
    - Then the expertly designed map:
        - Custom popups
            - Custom Locators
            - Custom popup content
        - Centered on Duluth
        - Good Basemap
        - Located below paragraph and title
        - Symbolized effectively and neatly
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Most Basic Web Map</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body{/* This makes everything centered from the top of the page */
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #map{
            width: 750px;
            height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid black;
        }

    </style>
</head>
<body>


    <div id="map"></div>
    
    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // Initialize the map, center it on UMD campus, and set the zoom level
        const map = L.map('map').setView([46.82, -92.08], 13);

        // Add OpenStreetMap tiles
        const tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        /*
        Essentially a copy/paste of Step 2 from Assigment 3
        */
        //fetch GeoJSON file
        fetch("duluth_points_of_interest.json")
            // once we fetch the geojson we need to convert then response into a json format
            .then(function (response) {
                return response.json()
            })
            // take the json data (our geojson's file data)
            // and create a leaflet layer based on that geojson (Adds it to the map)
            .then(function(geojsonData) {
                console.log('the geojson data', geojsonData);
                L.geoJSON(geojsonData, {
                    style: function(feature) {
                        return {
                            color: "black", // border color
                            weight: 1,      // border thickness
                            opacity: 1,     // border opacity
                        };
                    },  
                    // Takes the attributes from the json and shows them in the popup
                    // This is how every POI gets its popup content
                    onEachFeature: function(feature, layer) {
                        layer.bindPopup( 
                            "<div class = 'popup-styling'>" +
                            "<div class = 'popup-title'> Duluth Attraction: <b>" + feature.properties.Attraction + "</b></div><br>" +
                            "<b>Description: </b>" + feature.properties.Description + "<br>" +
                            "<b>Website: </b>" + feature.properties.Website + "<br>" +
                            "<b>Address: </b>" + feature.properties.Address + "<br>" +
                            "<b>Image: </b><img src='" + feature.properties.Photo_URL + "' alt='Image' style='max-width:200px;' />",
                            "</div>",
                        );
                    }
                }).addTo(map); 
            });
    </script>
</body>
</html>
